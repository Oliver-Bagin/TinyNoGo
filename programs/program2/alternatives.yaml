# Alternatives
- memfill:
    description: Program fills memory 
    flags:
      target: wasip1
      gc: conservative
      schedular: asyncify
- memclear:
    description: Program has interleaved GC
    flags:
      target: wasip1
      gc: conservative
      schedular: nc
- memclear-continuous:
    description: Program has interleaved GC with interleaved GC instructions
    flags:
      target: wasip1
      gc: continuous
      schedular: nc

